# Accelerate config: 2-GPU DDP training (for 4-bit quantization)
# Usage: accelerate launch --config_file accelerate_config_2gpu.yaml 3-5-qwen-grpo-train-multigpu.py

compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU  # Use DDP (DistributedDataParallel)
downcast_bf16: 'no'
enable_cpu_affinity: false
machine_rank: 0
main_training_function: main
mixed_precision: fp16  # Matches fp16=True in the code
num_machines: 1
num_processes: 2  # 2 GPU processes
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false

# ============================================================================
# Notes:
# 1. distributed_type: MULTI_GPU = PyTorch DDP
#    - Each GPU runs an independent process
#    - Each process has its own model replica
#    - Gradients are synchronized automatically after backward
#
# 2. Special requirements for 4-bit quantization + DDP:
#    - The model must be bound to the correct device at load time
#    - Use device_map={'': LOCAL_RANK}, not device_map='auto'
#    - accelerate sets LOCAL_RANK to 0, 1, 2, ...
#
# 3. Difference from FSDP/DeepSpeed:
#    - DDP: each GPU holds a full model replica (suitable for small models < 7B)
#    - FSDP: model parameters are sharded across GPUs (suitable for large models > 7B)
#    - DeepSpeed ZeRO: more aggressive memory optimization (suitable for very large models > 70B)
# ============================================================================
